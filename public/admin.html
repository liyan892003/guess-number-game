<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏管理 - 学生记录</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .admin-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .admin-header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 3rem;
            font-weight: bold;
        }
        .stat-card .label {
            font-size: 1rem;
            opacity: 0.9;
        }
        .student-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .student-item:last-child {
            border-bottom: none;
        }
        .student-item .id {
            font-weight: bold;
            color: #667eea;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
        }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>📊 游戏管理后台</h1>
            <p>查看参加游戏的学生记录</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="number" id="totalStudents">0</div>
                <div class="label">参加人次</div>
            </div>
        </div>
        
        <h3 style="margin-bottom: 15px;">📋 学生名单</h3>
        <div class="student-list" id="studentList">
            <p style="color: #666; text-align: center;">加载中...</p>
        </div>
        
        <div style="text-align: center;">
            <a href="/" class="back-btn">← 返回游戏</a>
        </div>
    </div>
    
    <script>
        async function loadRecords() {
            try {
                const response = await fetch('/admin/records');
                const data = await response.json();
                
                document.getElementById('totalStudents').textContent = data.totalParticipants;
                
                const studentList = document.getElementById('studentList');
                if (data.usedStudentIds.length === 0) {
                    studentList.innerHTML = '<p style="color: #666; text-align: center;">还没有学生参加过游戏</p>';
                } else {
                    studentList.innerHTML = data.usedStudentIds.map((id, index) => `
                        <div class="student-item">
                            <span class="id">#${index + 1}</span>
                            <span>${id}</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('加载记录失败:', error);
                document.getElementById('studentList').innerHTML = '<p style="color: red; text-align: center;">加载失败，请刷新页面</p>';
            }
        }
        
        loadRecords();
    </script>
</body>
</html>
